# SonarQube Configuration — ProjectMatch AI
# Module 8 Static Analysis Integration (Academic Specification SV UNS)

sonar.projectKey=projectmatch-ai
sonar.projectName=ProjectMatch AI
sonar.projectVersion=1.0.0

# Source paths
sonar.sources=nextjs-app,module-8-vite/src
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript Analysis
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=nextjs-app/tsconfig.json
