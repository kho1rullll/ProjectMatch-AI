services:
  # -----------------------------------------------------------
  # BACKEND SERVICE (FastAPI + Uvicorn + SQLite / PostgreSQL)
  # -----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectmatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ProjectMatch AI Backend
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY:-projectmatch-super-secret-jwt-key-2026-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./projectmatch_ai.db}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      # Persistensi data basis data SQLite ke host
      - ./projectmatch_ai.db:/app/projectmatch_ai.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - projectmatch-network

  # -----------------------------------------------------------
  # DATABASE SERVICE (Opsional: PostgreSQL 15 + pgvector)
  # Jalankan dengan: docker compose --profile postgres up -d
  # -----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: projectmatch-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: projectmatch_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./projectmatch_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - projectmatch-network

volumes:
  postgres_data:

networks:
  projectmatch-network:
    driver: bridge
