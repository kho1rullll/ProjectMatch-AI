name: CI Pipeline

on:
  push:
    branches: [main, master, ui-redesign]
  pull_request:
    branches: [main, master, ui-redesign]

jobs:
  module-8-vite-quality:
    name: Module 8 (Vite + Biome + Strict TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./module-8-vite
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './module-8-vite/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Biome Linter & Formatter Check
        run: npx @biomejs/biome check ./src

      - name: Strict TypeScript Verification
        run: npx tsc -b

      - name: Vite Production Build & Code Splitting
        run: npm run build

  production-nextjs-quality:
    name: Production Next.js 16 (Turbopack + RSC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nextjs-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './nextjs-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Production Next.js Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
